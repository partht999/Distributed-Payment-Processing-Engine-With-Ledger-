version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: payment_engine_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment_engine
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: payment_engine_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    command: redis-server --appendonly yes

  # ═══ DAY 59: Kafka (KRaft mode — no ZooKeeper needed) ═══
  # KRaft = Kafka Raft — Kafka manages its own metadata instead of relying on ZooKeeper.
  # This is the modern way to run Kafka (KIP-500, production-ready since Kafka 3.3).
  kafka:
    image: apache/kafka:3.7.0
    container_name: payment_engine_kafka
    ports:
      - "9092:9092"
    environment:
      # ── KRaft Configuration ──
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # ── Listener Configuration ──
      # PLAINTEXT = for our Spring Boot app (from host machine via port 9092)
      # CONTROLLER = for internal KRaft consensus (port 9093, never exposed)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # ── Topic Defaults ──
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # ── Auto-create our payment events topic ──
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # ── Cluster ID (required for KRaft) ──
      CLUSTER_ID: "payment-engine-kafka-cluster-01"
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  kafka_data:
