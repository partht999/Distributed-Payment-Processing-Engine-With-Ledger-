spring.application.name=payment_engine

spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/payment_engine
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ─── Redis Configuration ───
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=4
spring.data.redis.lettuce.pool.min-idle=1

# ─── Idempotency Configuration ───
# How long Redis remembers an idempotency key (in seconds).
# After this time, the key expires and can be reused.
# The PostgreSQL UNIQUE constraint is the permanent safety net.
# Recommended: dev=300, staging=3600, production=86400 (24h, same as Stripe)
payment.idempotency.ttl-seconds=300

# ─── Distributed Lock Configuration ───
# How long a wallet lock is held before auto-release (in seconds).
# Prevents deadlocks if a server crashes while holding a lock.
# Must be longer than the longest expected payment processing time.
# Recommended: dev=30, production=60
payment.lock.ttl-seconds=30

# ─── Processing Marker Configuration ───
# How long a "payment is being processed" marker lives in Redis.
# Prevents the same payment from being processed by two threads/servers.
# Should be longer than the wallet lock TTL since it wraps around it.
# Recommended: dev=60, production=120
payment.processing-marker.ttl-seconds=60

# ─── Kafka Configuration ───
spring.kafka.bootstrap-servers=localhost:9092

# Producer: how we send events to Kafka
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# Consumer: how we read events from Kafka
spring.kafka.consumer.group-id=payment-engine-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# Disable auto-start for Kafka listener so tests don't need Kafka running
spring.kafka.listener.auto-startup=true

# ─── Outbox Poller Configuration ───
# How often the poller checks for PENDING events (in milliseconds)
# Recommended: dev=5000, production=1000
outbox.poller.interval-ms=5000
# Kafka topic name for payment events
outbox.poller.topic=payment-events

logging.level.org.springframework.boot.autoconfigure=DEBUG

# ─── Consumer Retry + Dead Letter Queue ───
# Max retry attempts before routing to DLQ
consumer.retry.max-attempts=3
# Initial backoff delay (doubles each attempt: 1s, 2s, 4s)
consumer.retry.backoff-ms=1000

# ─── Redis Cache Configuration ───
# TTL for cached wallet data (in minutes)
# After this time, the cache entry expires and the next read hits the DB.
# Write operations (transfer/deposit/withdraw) evict the cache immediately.
spring.cache.redis.time-to-live=600000

# ─── Actuator & Prometheus Metrics ───
# Expose health, info, and prometheus endpoints for monitoring
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.metrics.export.prometheus.enabled=true
management.endpoint.health.show-details=always
